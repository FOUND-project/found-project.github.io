<!-- FOUND: site-wide layout + navigation -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --shell-max:1860px;
  --shell-pad:clamp(.85rem,2.2vw,2rem);
  --nav-ink:#e8f5f0;
  --nav-gold:#d4af37;
  --nav-font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
/* ---- Full-bleed shell -------------------------------------------------
   The theme lays .page on a Susy grid (span 10 of 12 + suffix 2 of 12) and
   pads #main by 1em, reserving ~17% of the viewport as empty margin. Unset
   the span, float, margins, padding and cap so every page uses full width. */
#main,.page,.page__inner-wrap,.page__content,.initial-content,.archive{
  max-width:100%!important;width:100%!important;float:none!important;
  margin-left:0!important;margin-right:0!important;
  padding-left:0!important;padding-right:0!important;
}
#main{margin-top:0!important}
/* Some pages set their own body padding, which pushed the fixed masthead
   sideways (it has no `left`) and dropped the clearance the nav needs. */
body{padding-left:0!important;padding-right:0!important;padding-top:70px!important}
.masthead{left:0!important;right:0!important}
/* these pages carry their own designed header, so drop the theme's duplicate */
.page__title:empty{display:none}
.archive:has(.news-shell) .page__title,.archive:has(.media-shell) .page__title,
.archive:has(.pub-shell) .page__title,.archive:has(.help-shell) .page__title,
.page__content:has(.team-page) .page__title,.page:has(.team-page) .page__title{display:none}
/* ---- Masthead --------------------------------------------------------- */
.masthead{
  background:linear-gradient(180deg,rgba(9,24,19,.97) 0%,rgba(14,42,31,.97) 100%);
  border-bottom:1px solid rgba(212,175,55,.30);
  box-shadow:0 8px 30px rgba(0,0,0,.32);
  -webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);
}
.masthead__inner-wrap{
  max-width:var(--shell-max)!important;margin:0 auto!important;
  padding:0 var(--shell-pad)!important;height:100%;
  display:flex;align-items:center;font-family:var(--nav-font)!important;
}
.masthead__menu{width:100%}
.greedy-nav{background:transparent!important;min-width:0}
.greedy-nav .visible-links{display:inline-flex!important;align-items:center;gap:.1rem;width:auto!important}
.greedy-nav .visible-links li{display:flex!important;align-items:center;vertical-align:middle}
.greedy-nav a{
  font-family:var(--nav-font);color:rgba(232,245,240,.76)!important;
  font-size:.75rem;font-weight:650;letter-spacing:.13em;text-transform:uppercase;
  margin:0!important;padding:.6rem .85rem!important;border-radius:999px;white-space:nowrap;
  transition:color .22s cubic-bezier(.4,0,.2,1),background .22s cubic-bezier(.4,0,.2,1);
}
.greedy-nav a:hover,.greedy-nav a:focus-visible{color:#fff!important;background:rgba(255,255,255,.09)}
/* replace the theme's scaleX bar with a gold underline */
.greedy-nav .visible-links a:before{display:none!important}
.greedy-nav .visible-links a:after{
  content:'';position:absolute;left:.85rem;right:.85rem;bottom:.3rem;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--nav-gold),transparent);
  opacity:0;transform:scaleX(.35);transition:opacity .25s ease,transform .25s cubic-bezier(.4,0,.2,1);
}
.greedy-nav .visible-links a:hover:after{opacity:1;transform:scaleX(1)}
/* ---- Brand ------------------------------------------------------------ */
.site-brand a{display:flex!important;align-items:center;gap:.62rem;padding:.3rem .75rem .3rem 0!important;background:transparent!important}
.site-brand a:after{display:none!important}
.site-brand__mark{height:34px;width:auto;display:block;flex:0 0 auto;filter:drop-shadow(0 2px 7px rgba(0,0,0,.45));transition:transform .3s cubic-bezier(.4,0,.2,1)}
.site-brand a:hover .site-brand__mark{transform:translateY(-1px) scale(1.04)}
.site-brand__text{font-family:var(--nav-font);font-weight:800;font-size:1.02rem;letter-spacing:.18em;color:#fff;line-height:1}
/* ---- Overflow menu ---------------------------------------------------- */
.greedy-nav button{
  background:rgba(212,175,55,.16)!important;color:var(--nav-gold)!important;
  border-radius:10px;height:auto;top:50%;transform:translateY(-50%);padding:.5rem .55rem!important;
}
.greedy-nav .navicon,.greedy-nav .navicon:before,.greedy-nav .navicon:after{background:var(--nav-gold)!important}
.greedy-nav .hidden-links{
  background:rgba(11,28,22,.98);border:1px solid rgba(212,175,55,.25);border-radius:14px;
  box-shadow:0 18px 44px rgba(0,0,0,.48);padding:.35rem;
}
.greedy-nav .hidden-links:before,.greedy-nav .hidden-links:after{display:none!important}
.greedy-nav .hidden-links a{color:rgba(232,245,240,.85)!important;text-align:left;border-radius:9px}
.greedy-nav .hidden-links a:hover{background:rgba(212,175,55,.14);color:#fff!important}
@media(max-width:600px){
  .site-brand__mark{height:28px}
  .site-brand__text{font-size:.92rem;letter-spacing:.14em}
  .greedy-nav a{font-size:.7rem;padding:.5rem .6rem!important;letter-spacing:.1em}
}
/* Page header with the FOUND pin-and-leaf logo on the left (publications, how-to-help, team) */
.found-header{position:relative;margin:1.75rem 0 2.5rem;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.08);border:1px solid rgba(15,23,42,.055);display:flex;align-items:stretch;text-align:left}
.found-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#d4af37 0%,rgba(212,175,55,.3) 100%)}
.found-header::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 300px at -5% 0%,rgba(212,175,55,.13) 0%,transparent 60%),radial-gradient(ellipse 500px 300px at 110% 100%,rgba(198,226,216,.5) 0%,transparent 60%);pointer-events:none}
.found-header-logo{flex:0 0 auto;display:flex;align-items:center;padding:2rem 2rem 2rem 2.8rem;position:relative;z-index:1}
.found-logo-tile{width:88px;height:88px;padding:5px;box-sizing:border-box;border-radius:20px;object-fit:contain;background:#fff;box-shadow:0 12px 32px rgba(15,23,42,.18);border:1px solid rgba(15,23,42,.06)}
.found-header-divider{width:1px;background:linear-gradient(180deg,transparent,rgba(15,23,42,.08),transparent);margin:2rem 0;flex-shrink:0}
.found-header-body{flex:1;padding:2rem 2.8rem 2rem 2.4rem;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.found-header-eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#1e4034;margin-bottom:.55rem}
.found-header-eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:#d4af37;box-shadow:0 0 0 3px rgba(212,175,55,.18)}
.found-header h1{font-size:clamp(1.9rem,4vw,2.75rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;color:#14342a;margin:0;padding:0}
.found-header h1::after{display:none}
@media(max-width:640px){.found-header{flex-direction:column}.found-header-logo{padding:1.4rem 1.4rem 0}.found-header-divider{display:none}.found-header-body{padding:.9rem 1.4rem 1.5rem}}
</style>
